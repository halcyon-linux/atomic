[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rmi"
version = "1.0.0"
description = "Safe removal to the XDG trash with collision handling."
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
rmi = "rmi:main"

[tool.setuptools.packages.find]
where = ["src"]

