# Bazzite: BBR congestion control + MTU probing for better latency and
# throughput on lossy links (game downloads/streaming); IPv6 privacy
# addressing matching Fedora defaults.
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_mtu_probing=1
net.ipv6.conf.all.use_tempaddr=2
net.ipv6.conf.default.use_tempaddr=2
