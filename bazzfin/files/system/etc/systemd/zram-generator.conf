# Bazzite's zram configuration (system_files/desktop/shared/etc/systemd/zram-generator.conf):
# zstd compression, zram sized at min(RAM/2, 16 GiB). Note: the "zram = full
# RAM + vm.swappiness=180" variant was proposed in ublue-os/bazzite PR #2202
# and rejected -- do not adopt it.
[zram0]
compression-algorithm=zstd
zram-size = min(ram / 2, 16384)
