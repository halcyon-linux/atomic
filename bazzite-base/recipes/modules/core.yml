        - cmake
        - cronie
        - curl
        - ddcutil
        - direnv
        - distrobox
        - fail2ban
        - fastfetch
        - file-roller
        - flatseal
        - fontconfig
        - fonts-filesystem
        - gcc-c++
        - git
        - go
        - grim
        - gsettings-desktop-schemas
        - gtk4-layer-shell
        - gzip
        - hunspell
        - hunspell-en
        - hunspell-en-GB
        - hunspell-en-US
        - ImageMagick
        - imv
        - inotify-tools
        - jq
        - liberation-fonts
        - libinput-utils
        - logrotate
        - lynis
        - man-db
        - mpv
        - ninja-build
        - pipx
        - pkgconf-pkg-config
        - plymouth
        - plymouth-theme-spinner
        - podman
