        - xdg-user-dirs-gtk
        - xhost
        - xorg-x11-server-Xorg
        - xorg-x11-server-Xwayland
        - xorg-x11-xauth
        - zathura
        - zathura-pdf-poppler
        - zathura-plugins-all
        - zsh
        - setroubleshoot
        - setroubleshoot-server
        - setroubleshoot-plugins
        - setools-console
        - udica
