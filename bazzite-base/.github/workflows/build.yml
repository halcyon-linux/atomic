name: bluebuild
on:
  schedule:
    - cron:
        "00 08 * * *" # build at 08:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - halcyon.yml
    steps:
      # Copr's download CDN intermittently 504s on repodata; poll until it
      # answers 200 (up to ~30 min) before spending 20+ min on the build.
      - name: Wait for Copr metadata availability
        run: |
          set -euo pipefail
          URL="https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-44-x86_64/repodata/repomd.xml"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            echo "attempt ${i}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 60
          done
          echo "::error::Copr metadata still unavailable after 30 attempts — aborting to avoid a wasted build; re-run later."
          exit 1

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
