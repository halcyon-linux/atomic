# Homebrew runtime directories (blue-build brew module practice; zz- prefix so
# this drop-in cannot be shadowed by a same-named file an RPM owns and sorts
# late). Created by systemd-tmpfiles at boot — /var must stay empty in the
# image layer (bootc seeds /var only on first provisioning).
d /var/lib/homebrew 0755 1000 1000 - -
d /var/cache/homebrew 0755 1000 1000 - -
d /var/home/linuxbrew 0755 1000 1000 - -
