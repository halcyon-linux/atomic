# dnf5 main-config drop-in (libdnf5 loads /etc/dnf/libdnf5.conf.d/*.conf
# before the main config). Copr's download CDN
# (download.copr.fedorainfracloud.org, behind CloudFront) intermittently
# answers 504 for repodata objects; make dnf5 patient instead of aborting
# the whole image build. Defaults were retries=10, timeout=30.
[main]
retries=20
timeout=60
