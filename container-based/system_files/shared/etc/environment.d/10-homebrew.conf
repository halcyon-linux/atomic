# Homebrew environment for systemd user sessions, Wayland compositors, and GUI apps.
#
# /etc/profile.d/brew.sh (upstream ublue-os/brew script, shipped by this image)
# only fires for interactive shells ([[ $- == *i* ]]).  The systemd --user
# instance, Hyprland, Noctalia and apps launched from the desktop inherit a
# PAM/systemd environment that does NOT source profile.d.  This file is picked
# up by systemd-environment-d-generator and injects the brew bin dirs into
# every user session's environment unconditionally — making installed brew
# packages available immediately after first login without requiring a new
# shell.
#
# Brew bin dirs are appended (not prepended) to preserve system-binary
# priority, consistent with the upstream ublue-os/brew design decision.
# NOTE: never use bare `PATH=$PATH:...` here. systemd-environment-d-generator
# can run without PATH in its environment; `$PATH` then expands to empty and
# this file would emit `PATH=:/home/linuxbrew/...` — no /usr/bin, which breaks
# every session inheriting it ("command not found" for grep/sed/sudo/...).
# `${PATH:-...}` (environment.d(5), systemd >= 233) guards against that.
PATH=${PATH:-/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew
HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar
HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew
