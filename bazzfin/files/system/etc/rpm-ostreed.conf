# Managed by bazzfin's build (files module). uupd owns automatic updates on
# this image, exactly like Bazzite; keeping rpm-ostreed's own policy at
# "none" prevents rpm-ostreed-automatic.timer from fighting uupd.timer
# (required by uupd on uBlue-main-derived images, where the base ships
# AutomaticUpdatePolicy=stage). rpm-ostreed-automatic.timer is additionally
# masked by the `systemd` module in recipes/recipe.yml.
[Daemon]
AutomaticUpdatePolicy=none
